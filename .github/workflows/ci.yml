name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      # Catch packaging breakage before a release tag does; the installer is kept for a few days for testing.
      - name: Publish and build installer
        shell: pwsh
        run: |
          ./build/publish.ps1 -Version 0.0.0-ci.${{ github.run_number }} -Output artifacts/publish
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { throw 'Inno Setup install failed' } }
          & $iscc /Q /DAppVersion=0.0.0-ci.${{ github.run_number }} installer/PlayMode.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/*.exe
          retention-days: 7
