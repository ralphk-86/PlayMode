name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub release with the installer, a portable zip and checksums.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '${{ github.ref_name }}' isn't a version like v1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.version.outputs.version }} -Output artifacts/publish

      - name: Installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { throw 'Inno Setup install failed' } }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer/PlayMode.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }

      - name: Zip, checksums, release notes
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/PlayMode-$v-win-x64.zip"
          Get-ChildItem artifacts/*.exe, artifacts/*.zip |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt
          # The CHANGELOG section for this version becomes the release notes.
          $notes = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' | Where-Object { $_ -match "^\[?$([regex]::Escape($v))\]?" } | Select-Object -First 1
          if (-not $notes) { throw "CHANGELOG.md has no section for $v" }
          ($notes -replace '^[^\r\n]*\r?\n', '').Trim() | Set-Content artifacts/notes.md

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $extra = @(if ($v -match '-') { '--prerelease' })
          gh release create '${{ github.ref_name }}' --title "PlayMode $v" --notes-file artifacts/notes.md @extra `
            "artifacts/PlayMode-$v-setup-x64.exe" "artifacts/PlayMode-$v-win-x64.zip" artifacts/SHA256SUMS.txt
